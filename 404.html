<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // ADHESIVE LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body {
            background: #050505;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }
        img {
            max-width: 200px;
            width: 100%;
            filter: invert(1) brightness(1.2);
            margin-bottom: 2rem;
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }
        h1 {
            font-size: 4rem;
            letter-spacing: 6px;
            margin-bottom: 0.5rem;
        }
        p {
            color: #777;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 2.5rem;
        }
        a {
            color: #fff;
            border: 1px solid #333;
            padding: 0.9rem 1.5rem;
            text-decoration: none;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        a:hover { border-color: #fff; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <img src="logo.png" alt="ADHESIVE LAB">
    <h1>404</h1>
    <p>TA NAKLEJKA NIE ISTNIEJE.</p>
    <a href="/">← WRÓĆ DO KATALOGU</a>
</body>
</html>
