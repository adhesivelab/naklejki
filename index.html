<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHESIVE LAB // KATALOG NAKLEJEK</title>
    <meta name="description" content="Archiwum naklejek ADHESIVE LAB. Holograficzne, matowe i chromowane wycięcia. Zamówienia przez Instagram DM.">

    <meta property="og:title" content="ADHESIVE LAB // KATALOG NAKLEJEK">
    <meta property="og:description" content="Archiwum naklejek ADHESIVE LAB. Zamówienia przez Instagram DM.">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #050505;
            --card-black: #0d0d0d;
            --border-dark: #222222;
            --text-white: #f5f5f5;
            --text-gray: #777777;
            --accent-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            padding: 2rem 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ========== NAGŁÓWEK ========== */
        header {
            text-align: center;
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            max-width: 240px;
            width: 100%;
            height: auto;
            margin-bottom: 1.5rem;
            filter: invert(1) brightness(1.2);
            transition: transform 0.4s ease, filter 0.3s ease;
        }

        .logo-img:hover { transform: scale(1.04); }

        header > p {
            color: var(--text-gray);
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .notice-bar {
            margin-top: 1.2rem;
            display: inline-block;
            border: 1px solid var(--border-dark);
            padding: 0.5rem 1.2rem;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #aaa;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.02);
            text-decoration: none;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .notice-bar:hover {
            border-color: var(--text-white);
            color: var(--text-white);
        }

        .counter {
            margin-top: 1rem;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #555;
        }
        .counter span { color: var(--text-white); font-weight: 700; }

        /* ========== WYSZUKIWARKA ========== */
        .search-bar {
            max-width: 400px;
            margin: 0 auto 1.5rem;
        }

        .search-bar input {
            width: 100%;
            background: var(--card-black);
            border: 1px solid var(--border-dark);
            color: var(--text-white);
            padding: 0.7rem 1rem;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-bar input:focus { border-color: var(--accent-white); }
        .search-bar input::placeholder { color: var(--text-gray); }

        /* ========== FILTRY ========== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .chip {
            background: transparent;
            border: 1px solid var(--border-dark);
            color: var(--text-gray);
            padding: 0.4rem 0.9rem;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .chip:hover { color: var(--text-white); border-color: #444; }
        .chip.is-active {
            background: var(--text-white);
            color: var(--bg-black);
            border-color: var(--text-white);
            font-weight: 700;
        }

        /* ========== SORTOWANIE ========== */
        .sort-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-gray);
        }

        .sort-bar select {
            background: var(--card-black);
            border: 1px solid var(--border-dark);
            color: var(--text-white);
            padding: 0.4rem 0.8rem;
            font-family: inherit;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* ========== SIATKA ========== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 5rem;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-gray);
            font-size: 0.8rem;
            letter-spacing: 2px;
            padding: 3rem 0;
        }

        .card {
            background-color: var(--card-black);
            border: 1px solid var(--border-dark);
            overflow: hidden;
            transition: border-color 0.3s ease, transform 0.3s ease, background-color 0.3s ease;
            cursor: pointer;
            opacity: 0;
            transform: translateY(12px);
            animation: cardIn 0.5s ease forwards;
            animation-delay: calc(var(--i, 0) * 40ms);
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            border-color: var(--accent-white);
            transform: translateY(-4px);
        }

        .card-img {
            width: 100%;
            height: 280px;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-dark);
            transition: background-color 0.3s ease;
        }

        .card-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .card:hover .card-img img { transform: scale(1.06); }

        .card-info {
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-tag {
            font-size: 0.7rem;
            color: var(--text-gray);
            border: 1px solid var(--border-dark);
            padding: 0.2rem 0.5rem;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ========== MODAL ========== */
        .modal {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, background 0.3s ease;
        }

        .modal.is-open { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: var(--bg-black);
            border: 1px solid var(--border-dark);
            max-width: 520px;
            width: 100%;
            padding: 2rem;
            position: relative;
            transform: scale(0.96);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2), background 0.3s ease;
            max-height: 92vh;
            overflow-y: auto;
        }

        .modal.is-open .modal-box { transform: scale(1); }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
            z-index: 2;
        }
        .close-btn:hover { color: var(--text-white); }

        /* ========== GALERIA ========== */
        .gallery-main { position: relative; }

        .modal-img-wrap {
            width: 100%;
            height: 260px;
            background: #111;
            border: 1px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background-color 0.3s ease;
        }

        .modal-img-wrap img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-dark);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.2s ease, opacity 0.2s ease;
            z-index: 2;
        }

        body.light .gallery-arrow {
            background: rgba(255, 255, 255, 0.8);
            color: #000;
        }

        .gallery-arrow:hover { background: rgba(0, 0, 0, 0.9); }
        .gallery-arrow.prev { left: 0.5rem; }
        .gallery-arrow.next { right: 0.5rem; }

        .gallery-arrow:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .gallery-thumbs {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
        }

        .gallery-thumbs:empty { display: none; }

        .gallery-thumb {
            flex: 0 0 60px;
            width: 60px;
            height: 60px;
            background: #111;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 0.25rem;
            transition: border-color 0.2s ease, background-color 0.3s ease;
        }

        body.light .gallery-thumb { background: #f0f0f0; }

        .gallery-thumb.is-active { border-color: var(--accent-white); }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gallery-counter {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-gray);
            letter-spacing: 1.5px;
            margin-top: 0.5rem;
            min-height: 1em;
        }

        /* ========== TREŚĆ MODALA ========== */
        .modal-h2 {
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1rem 0 0.5rem;
        }

        .modal-desc {
            color: var(--text-gray);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .specs {
            border-top: 1px solid var(--border-dark);
            border-bottom: 1px solid var(--border-dark);
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .specs span { color: var(--text-gray); }
        .specs strong {
            color: var(--text-white);
            display: block;
            margin-top: 0.2rem;
        }

        .actions { display: flex; gap: 1rem; }

        .btn-black {
            flex: 1;
            background: var(--text-white);
            color: var(--bg-black);
            border: none;
            padding: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .btn-black:hover { background: #ccc; }

        .btn-outline {
            background: transparent;
            color: var(--text-white);
            border: 1px solid var(--border-dark);
            padding: 0.85rem 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
            font-family: inherit;
        }
        .btn-outline:hover { border-color: var(--text-white); }
        .btn-outline:disabled {
            opacity: 0.85;
            cursor: default;
            border-color: #4ade80;
            color: #4ade80;
        }

        /* ========== THEME TOGGLE ========== */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-black);
            border: 1px solid var(--border-dark);
            color: var(--text-white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 999;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            border-color: var(--accent-white);
        }

        /* ========== FOCUS ========== */
        :focus-visible {
            outline: 2px solid var(--text-white);
            outline-offset: 3px;
        }

        /* ========== STOPKA ========== */
        footer {
            text-align: center;
            color: var(--text-gray);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-top: 1px solid var(--border-dark);
            padding-top: 2rem;
        }

        /* ========== LIGHT MODE ========== */
        body.light {
            --bg-black: #f5f5f5;
            --card-black: #ffffff;
            --border-dark: #e0e0e0;
            --text-white: #0a0a0a;
            --text-gray: #666666;
            --accent-white: #000000;
        }

        body.light .logo-img { filter: none; }

        body.light .notice-bar {
            background: rgba(0, 0, 0, 0.03);
            color: #444;
        }

        body.light .card-img,
        body.light .modal-img-wrap { background: #f0f0f0; }

        body.light .modal { background: rgba(255, 255, 255, 0.92); }

        body.light .btn-black {
            background: #000;
            color: #fff;
        }
        body.light .btn-black:hover { background: #222; }

        /* ========== MOBILE ========== */
        @media (max-width: 480px) {
            body { padding: 1.5rem 0.75rem; }
            header { margin-bottom: 2.5rem; }
            .card-img { height: 220px; }
            .modal-box { padding: 1.5rem; }
            .actions { flex-direction: column; }
            .specs { flex-direction: column; gap: 0.75rem; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Przełącz tryb jasny/ciemny">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="container">
        <header>
            <img src="logo.png" alt="ADHESIVE LAB LOGO" class="logo-img">
            <p>ARCHIWUM // KATALOG NAKLEJEK</p>
            <a href="https://instagram.com/adhesive.lab" target="_blank" rel="noopener" class="notice-bar">
                ZAMÓWIENIA TYLKO W WIADOMOŚCI PRIV (DM) NA INSTAGRAMIE @ADHESIVE.LAB
            </a>
            <p class="counter"><span id="stickerCount">0</span> WZORÓW W ARCHIWUM</p>
        </header>

        <div class="search-bar">
            <input type="search" id="searchInput" placeholder="SZUKAJ NAKLEJKI..." aria-label="Szukaj naklejki">
        </div>

        <nav class="filters" id="filters" aria-label="Filtruj naklejki"></nav>

        <div class="sort-bar">
            <label for="sortSelect">SORTUJ:</label>
            <select id="sortSelect" aria-label="Sortowanie">
                <option value="default">DOMYŚLNIE</option>
                <option value="name-asc">NAZWA A → Z</option>
                <option value="name-desc">NAZWA Z → A</option>
                <option value="newest">NAJNOWSZE</option>
            </select>
        </div>

        <div class="grid" id="stickerGrid" aria-live="polite"></div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="stickerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box" role="document">
            <button class="close-btn" id="closeBtn" aria-label="Zamknij podgląd">&times;</button>

            <div class="gallery-main">
                <div class="modal-img-wrap">
                    <img id="modalImg" src="" alt="">
                </div>
                <button class="gallery-arrow prev" id="galleryPrev" aria-label="Poprzednie zdjęcie">‹</button>
                <button class="gallery-arrow next" id="galleryNext" aria-label="Następne zdjęcie">›</button>
            </div>
            <div class="gallery-thumbs" id="galleryThumbs"></div>
            <div class="gallery-counter" id="galleryCounter"></div>

            <h2 class="modal-h2" id="modalTitle">NAZWA NAKLEJKI</h2>
            <p class="modal-desc" id="modalDesc">Opis projektu naklejki.</p>

            <div class="specs">
                <div>
                    <span>WYKOŃCZENIE</span>
                    <strong id="modalFinish">—</strong>
                </div>
                <div>
                    <span>ROZMIAR</span>
                    <strong id="modalSize">—</strong>
                </div>
            </div>

            <div class="actions">
                <a id="modalDmBtn" href="#" target="_blank" rel="noopener" class="btn-black">ZAMÓW NA INSTA DM</a>
                <button class="btn-outline" id="copyBtn" type="button">SKOPIUJ WZÓR</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ADHESIVE LAB. WSZYSTKIE PRAWA ZASTRZEŻONE.</p>
    </footer>

    <script>
        /* =========================================================
           1. DANE — EDYTUJ TUTAJ
           =========================================================
           Nowa naklejka = nowy obiekt w tablicy.
           `images` to tablica zdjęć (pierwsze = okładka).
           Jeśli chcesz tylko jedno zdjęcie, wpisz jednoelementową tablicę.
           ========================================================= */
        const INSTAGRAM_USERNAME = "adhesive.lab";

        const stickers = [
            {
                id: 1,
                title: "ADHESIVE TRIBAL SKULL",
                category: "HOLO WYCIĘCIE",
                finish: "Holograficzne / Wodoodporne",
                size: "8 x 8 CM",
                desc: "Gotycki motyw czaszki z ostrymi krawędziami. Mieniące się refleksy holograficzne pod kątem światła.",
                images: [
                    "https://picsum.photos/id/1062/400/400",
                    "https://picsum.photos/id/1063/400/400",
                    "https://picsum.photos/id/1064/400/400"
                ]
            },
            {
                id: 2,
                title: "CHROME STARBURST",
                category: "MATOWY CHROM",
                finish: "Matowy Winyl Premium",
                size: "10 x 5 CM",
                desc: "Stylówka Y2K z chromowanym wykończeniem i głębokim matowym czarnym tłem.",
                images: [
                    "https://picsum.photos/id/1069/400/400",
                    "https://picsum.photos/id/1070/400/400"
                ]
            },
            {
                id: 3,
                title: "DARK MATTER LOGO",
                category: "BŁYSZCZĄCY WINYL",
                finish: "Błysk UV / Odporna na deszcz",
                size: "7 x 7 CM",
                desc: "Klasyczne logo z odporną warstwą ochronną UV. Wycięte idealnie po obrysie.",
                images: [
                    "https://picsum.photos/id/1025/400/400"
                ]
            }
        ];

        /* =========================================================
           2. STAN I ELEMENTY
           ========================================================= */
        const grid = document.getElementById('stickerGrid');
        const modal = document.getElementById('stickerModal');
        const filtersEl = document.getElementById('filters');
        const countEl = document.getElementById('stickerCount');
        const closeBtn = document.getElementById('closeBtn');
        const copyBtn = document.getElementById('copyBtn');
        const dmBtn = document.getElementById('modalDmBtn');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const galleryPrev = document.getElementById('galleryPrev');
        const galleryNext = document.getElementById('galleryNext');
        const galleryThumbs = document.getElementById('galleryThumbs');
        const galleryCounter = document.getElementById('galleryCounter');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        let currentSticker = null;
        let activeFilter = 'WSZYSTKIE';
        let sortMode = 'default';
        let searchQuery = '';
        let lastFocused = null;
        let galleryImages = [];
        let galleryIndex = 0;

        /* =========================================================
           3. NORMALIZACJA DANYCH (fallback img -> images)
           ========================================================= */
        stickers.forEach(s => {
            if (!s.images || !s.images.length) {
                s.images = s.img ? [s.img] : [placeholderFor(s.title)];
            }
        });

        /* =========================================================
           4. POMOCNICZE
           ========================================================= */
        const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));

        function placeholderFor(title) {
            const initials = String(title).split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
                <rect width="100%" height="100%" fill="#111"/>
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                      font-family="Space Grotesk, sans-serif" font-size="42" fill="#444">${initials}</text>
            </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        /* =========================================================
           5. MOTYW (DARK / LIGHT)
           ========================================================= */
        function applyTheme(theme) {
            document.body.classList.toggle('light', theme === 'light');
            themeIcon.textContent = theme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', theme);
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                applyTheme(saved);
            } else {
                const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                applyTheme(prefersLight ? 'light' : 'dark');
            }
        }

        themeToggle.addEventListener('click', () => {
            const isLight = document.body.classList.contains('light');
            applyTheme(isLight ? 'dark' : 'light');
        });

        /* =========================================================
           6. FILTRY
           ========================================================= */
        function getCategories() {
            return ['WSZYSTKIE', ...new Set(stickers.map(s => s.category))];
        }

        function renderFilters() {
            filtersEl.innerHTML = getCategories().map(cat => `
                <button type="button" class="chip ${cat === activeFilter ? 'is-active' : ''}"
                        data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>
            `).join('');

            filtersEl.querySelectorAll('.chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeFilter = btn.dataset.cat;
                    renderFilters();
                    render();
                });
            });
        }

        /* =========================================================
           7. RENDER SIATKI
           ========================================================= */
        function render() {
            let list = activeFilter === 'WSZYSTKIE'
                ? [...stickers]
                : stickers.filter(s => s.category === activeFilter);

            if (searchQuery) {
                list = list.filter(s =>
                    s.title.toLowerCase().includes(searchQuery) ||
                    s.desc.toLowerCase().includes(searchQuery)
                );
            }

            if (sortMode === 'name-asc')  list.sort((a,b) => a.title.localeCompare(b.title));
            if (sortMode === 'name-desc') list.sort((a,b) => b.title.localeCompare(a.title));
            if (sortMode === 'newest')    list.sort((a,b) => b.id - a.id);

            countEl.textContent = stickers.length;

            if (!list.length) {
                grid.innerHTML = `<p class="empty">BRAK NAKLEJEK SPEŁNIAJĄCYCH KRYTERIA.</p>`;
                return;
            }

            grid.innerHTML = list.map((s, i) => {
                const first = s.images[0];
                return `
                <article class="card" style="--i:${i}" data-id="${s.id}" tabindex="0" role="button"
                         aria-label="Pokaż szczegóły: ${escapeHtml(s.title)}">
                    <div class="card-img">
                        <img src="${escapeHtml(first)}" alt="${escapeHtml(s.title)}"
                             loading="lazy"
                             onerror="this.onerror=null;this.src='${placeholderFor(s.title)}'">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${escapeHtml(s.title)}</div>
                        <div class="card-tag">${escapeHtml(s.category)}</div>
                    </div>
                </article>`;
            }).join('');

            grid.querySelectorAll('.card').forEach(card => {
                const open = () => openModal(Number(card.dataset.id));
                card.addEventListener('click', open);
                card.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
                });
            });
        }

        /* =========================================================
           8. GALERIA
           ========================================================= */
        function showGalleryImage(index) {
            if (!galleryImages.length) return;
            galleryIndex = Math.max(0, Math.min(index, galleryImages.length - 1));
            document.getElementById('modalImg').src = galleryImages[galleryIndex];
            galleryCounter.textContent = galleryImages.length > 1
                ? `${galleryIndex + 1} / ${galleryImages.length}`
                : '';

            galleryPrev.disabled = galleryIndex === 0;
            galleryNext.disabled = galleryIndex === galleryImages.length - 1;

            galleryThumbs.querySelectorAll('.gallery-thumb').forEach((t, i) => {
                t.classList.toggle('is-active', i === galleryIndex);
            });
        }

        function buildGallery(images) {
            galleryImages = images;
            galleryIndex = 0;

            galleryThumbs.innerHTML = images.length > 1 ? images.map((src, i) => `
                <button class="gallery-thumb ${i === 0 ? 'is-active' : ''}" data-idx="${i}" type="button"
                        aria-label="Zdjęcie ${i + 1}">
                    <img src="${escapeHtml(src)}" alt="" loading="lazy">
                </button>
            `).join('') : '';

            galleryThumbs.querySelectorAll('.gallery-thumb').forEach(btn => {
                btn.addEventListener('click', () => showGalleryImage(Number(btn.dataset.idx)));
            });

            const single = images.length <= 1;
            galleryPrev.style.display = single ? 'none' : '';
            galleryNext.style.display = single ? 'none' : '';

            showGalleryImage(0);
        }

        galleryPrev.addEventListener('click', () => showGalleryImage(galleryIndex - 1));
        galleryNext.addEventListener('click', () => showGalleryImage(galleryIndex + 1));

        /* =========================================================
           9. MODAL
           ========================================================= */
        function openModal(id) {
            currentSticker = stickers.find(s => s.id === id);
            if (!currentSticker) return;

            lastFocused = document.activeElement;

            buildGallery(currentSticker.images);
            document.getElementById('modalImg').alt = currentSticker.title;
            document.getElementById('modalTitle').innerText = currentSticker.title;
            document.getElementById('modalDesc').innerText = currentSticker.desc;
            document.getElementById('modalFinish').innerText = currentSticker.finish;
            document.getElementById('modalSize').innerText = currentSticker.size;

            const msg = encodeURIComponent(
                `Siema! Chcę zapytać / zamówić naklejkę: ${currentSticker.title} (${currentSticker.size})`
            );
            dmBtn.href = `https://ig.me/m/${INSTAGRAM_USERNAME}?text=${msg}`;

            copyBtn.textContent = 'SKOPIUJ WZÓR';
            copyBtn.disabled = false;

            modal.classList.add('is-open');
            document.body.style.overflow = 'hidden';
            closeBtn.focus();
        }

        function closeModal() {
            modal.classList.remove('is-open');
            document.body.style.overflow = '';
            if (lastFocused) lastFocused.focus();
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

        /* =========================================================
           10. KLAWIATURA (Esc, ←, →)
           ========================================================= */
        document.addEventListener('keydown', e => {
            if (!modal.classList.contains('is-open')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') showGalleryImage(galleryIndex - 1);
            if (e.key === 'ArrowRight') showGalleryImage(galleryIndex + 1);
        });

        /* =========================================================
           11. SWIPE (dotyk)
           ========================================================= */
        let touchStartX = 0;
        modal.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        modal.addEventListener('touchend', e => {
            if (!modal.classList.contains('is-open')) return;
            const dx = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(dx) < 50) return;
            if (dx > 0) showGalleryImage(galleryIndex - 1);
            else showGalleryImage(galleryIndex + 1);
        }, { passive: true });

        /* =========================================================
           12. KOPIOWANIE
           ========================================================= */
        copyBtn.addEventListener('click', async () => {
            if (!currentSticker) return;
            const text = `Siema! Zamawiam naklejkę: ${currentSticker.title} (${currentSticker.size})`;
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = 'SKOPIOWANO ✓';
                copyBtn.disabled = true;
                setTimeout(() => {
                    copyBtn.textContent = 'SKOPIUJ WZÓR';
                    copyBtn.disabled = false;
                }, 2000);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta);
                ta.select(); document.execCommand('copy'); ta.remove();
                copyBtn.textContent = 'SKOPIOWANO ✓';
                setTimeout(() => {
                    copyBtn.textContent = 'SKOPIUJ WZÓR';
                }, 2000);
            }
        });

        /* =========================================================
           13. SEARCH + SORT
           ========================================================= */
        searchInput.addEventListener('input', e => {
            searchQuery = e.target.value.toLowerCase().trim();
            render();
        });

        sortSelect.addEventListener('change', () => {
            sortMode = sortSelect.value;
            render();
        });

        /* =========================================================
           14. START
           ========================================================= */
        initTheme();
        renderFilters();
        render();
    </script>
</body>
</html>
