<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHESIVE LAB // KATALOG I KREATOR</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-black: #050505; --card-black: #0d0d0d; --border-dark: #222222; --text-white: #f5f5f5; --text-gray: #777777; --accent-white: #ffffff; --accent-new: #4ade80; --accent-like: #ff4d6d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-white); min-height: 100vh; padding: 2rem 1rem; transition: background-color 0.3s ease, color 0.3s ease; }
        .container { max-width: 1100px; margin: 0 auto; }
        .mini-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(5,5,5,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-dark); padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; z-index: 998; transform: translateY(-100%); transition: transform 0.3s ease, background 0.3s ease; }
        body.light .mini-header { background: rgba(245,245,245,0.85); }
        .mini-header.is-visible { transform: translateY(0); }
        .mini-header img { height: 28px; width: auto; filter: invert(1) brightness(1.2); transition: filter 0.3s ease; }
        .mini-header a { font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-white); border: 1px solid var(--border-dark); padding: 0.4rem 0.8rem; text-decoration: none; }
        header { text-align: center; margin-bottom: 2rem; display: flex; flex-direction: column; align-items: center; }
        .logo-img { max-width: 380px; width: 100%; height: auto; margin-bottom: 1.5rem; filter: invert(1) brightness(1.2); transform-style: preserve-3d; animation: spinLogo 12s linear infinite; transition: filter 0.3s ease; }
        @keyframes spinLogo { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .logo-img:hover { animation-play-state: paused; }
        header > p { color: var(--text-gray); font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase; }
        .notice-bar { margin-top: 1.2rem; display: inline-block; border: 1px solid var(--border-dark); padding: 0.5rem 1.2rem; font-size: 0.75rem; letter-spacing: 1.5px; color: #aaa; text-transform: uppercase; text-decoration: none; }
        .nav-tabs { display: flex; gap: 1rem; margin: 2rem auto 4rem; max-width: 800px; flex-wrap: wrap; justify-content: center; }
        .nav-tab { flex: 1; min-width: 200px; padding: 1.5rem; background: var(--card-black); border: 1px solid var(--border-dark); color: var(--text-white); text-align: center; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; cursor: pointer; border-radius: 4px; }
        .nav-tab.active { background: var(--text-white); color: var(--bg-black); border-color: var(--text-white); }
        .app-section { display: none; } .app-section.active { display: block; }
        .search-bar { max-width: 400px; margin: 0 auto 1.5rem; }
        .search-bar input { width: 100%; background: var(--card-black); border: 1px solid var(--border-dark); color: var(--text-white); padding: 0.7rem 1rem; border-radius: 4px; text-transform: uppercase; }
        .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
        .chip { background: transparent; border: 1px solid var(--border-dark); color: var(--text-gray); padding: 0.4rem 0.9rem; cursor: pointer; border-radius: 4px; text-transform: uppercase; }
        .chip.is-active { background: var(--text-white); color: var(--bg-black); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 5rem; }
        .card { background-color: var(--card-black); border: 1px solid var(--border-dark); cursor: pointer; border-radius: 4px; overflow: hidden; }
        .card-img { width: 100%; height: 280px; background: #111; display: flex; align-items: center; justify-content: center; position: relative; }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .like-btn { position: absolute; top: 0.5rem; right: 0.5rem; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid var(--border-dark); color: #fff; cursor: pointer; }
        .like-btn.is-liked::before { content: '♥'; color: var(--accent-like); } .like-btn::before { content: '♡'; }
        .card-info { padding: 1.2rem; display: flex; justify-content: space-between; }
        .creator-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .creator-panel { background: var(--card-black); border: 1px solid var(--border-dark); padding: 2rem; border-radius: 4px; }
        .creator-input { width: 100%; background: var(--bg-black); border: 1px solid var(--border-dark); color: var(--text-white); padding: 1rem; border-radius: 4px; }
        .options-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .opt-btn { background: transparent; border: 1px solid var(--border-dark); color: var(--text-white); padding: 0.6rem 1rem; cursor: pointer; border-radius: 4px; }
        .opt-btn.active { border-color: var(--text-white); background: rgba(128,128,128,0.2); }
        .creator-preview { background: #0a0a0a; border: 1px solid var(--border-dark); display: flex; align-items: center; justify-content: center; min-height: 400px; border-radius: 4px; }
        .preview-sticker { display: flex; align-items: center; gap: 1rem; }
        .preview-sticker svg { width: 48px; height: 48px; }
        .preview-text { font-size: 2.5rem; font-weight: 700; }
        .btn-black { background: var(--text-white); color: var(--bg-black); border: none; padding: 1rem; font-weight: 700; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 1rem; }
        .guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .guide-card { background: var(--card-black); border: 1px solid var(--border-dark); padding: 2rem; border-radius: 4px; }
        body.light { --bg-black: #f5f5f5; --card-black: #ffffff; --border-dark: #e0e0e0; --text-white: #0a0a0a; --text-gray: #666666; --accent-white: #000000; }
        body.light .logo-img, body.light .mini-header img { filter: none; }
        body.light .card-img { background: #f0f0f0; }
        body.light .creator-input { background: #fff; }
    </style>
</head>
<body>
    <div class="mini-header" id="miniHeader">
        <img src="logo.png" alt="LOGO">
        <a href="https://instagram.com/adhesive.lab" target="_blank">DM → ZAMÓW</a>
    </div>

    <div class="container">
        <header>
            <img src="logo.png" alt="LOGO" class="logo-img">
            <p>ARCHIWUM // KATALOG NAKLEJEK</p>
        </header>

        <div class="nav-tabs">
            <button class="nav-tab" data-target="section-creator">KREATOR</button>
            <button class="nav-tab active" data-target="section-catalog">GOTOWE WZORY</button>
            <button class="nav-tab" data-target="section-guide">INSTRUKCJA</button>
        </div>

        <div id="section-creator" class="app-section">
            <div class="creator-layout">
                <div class="creator-panel">
                    <h4>1. TREŚĆ NAKLEJKI</h4>
                    <input type="text" id="handleText" class="creator-input" value="@twoj_nick">
                    <h4>2. IKONA</h4>
                    <div class="options-grid" id="iconOptions">
                        <button class="opt-btn active" data-icon="instagram">📷 Instagram</button>
                        <button class="opt-btn" data-icon="tiktok">🎵 TikTok</button>
                        <button class="opt-btn" data-icon="none">🚫 Brak</button>
                    </div>
                    <h4>3. KOLOR</h4>
                    <div class="options-grid" id="colorOptions">
                        <button class="opt-btn active" data-color="#ffffff">Biały</button>
                        <button class="opt-btn" data-color="#000000">Czarny</button>
                        <button class="opt-btn" data-color="gold">Złoty</button>
                        <button class="opt-btn" data-color="holo">Holo</button>
                    </div>
                    <button class="btn-black" id="addToCartBtn">ZAMÓW PRZEZ DM</button>
                </div>
                <div class="creator-preview">
                    <div class="preview-sticker" id="stickerPreview">
                        <svg id="previewIcon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                        <span class="preview-text" id="previewText" style="color: #ffffff;">@TWOJ_NICK</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-catalog" class="app-section active">
            <div class="search-bar"><input type="search" id="searchInput" placeholder="SZUKAJ..."></div>
            <nav class="filters" id="filters"></nav>
            <div class="grid" id="stickerGrid"></div>
        </div>

        <div id="section-guide" class="app-section">
            <h2 style="text-align:center; margin-bottom:2rem;">JAK NAKLEIĆ FOLIĘ?</h2>
            <div class="guide-grid">
                <div class="guide-card"><h3>01</h3><h5>ODTŁUSZCZENIE</h5><p>Umyj powierzchnię alkoholem (IPA).</p></div>
                <div class="guide-card"><h3>02</h3><h5>DOCISK</h5><p>Dociskaj folię transferową ręką.</p></div>
                <div class="guide-card"><h3>03</h3><h5>APLIKACJA</h5><p>Odklej podkład i przyklej.</p></div>
                <div class="guide-card"><h3>04</h3><h5>ZDEJMOWANIE</h5><p>Powoli odklejaj taśmę.</p></div>
            </div>
        </div>
    </div>
    <script>
        const INSTAGRAM_USERNAME = "adhesive.lab";
        const stickers = [
            { id: 1, title: "TRIBAL SKULL", category: "HOLO", images: ["https://picsum.photos/id/1062/400/400"] },
            { id: 2, title: "CHROME STAR", category: "CHROM", images: ["https://picsum.photos/id/1069/400/400"] }
        ];
        let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');

        // NAWIGACJA
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        // KREATOR
        const previewIcon = document.getElementById('previewIcon');
        const previewText = document.getElementById('previewText');
        const handleText = document.getElementById('handleText');

        const icons = {
            instagram: '<path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>',
            tiktok: '<path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>',
            none: ''
        };

        handleText.addEventListener('input', (e) => { previewText.textContent = e.target.value.toUpperCase(); });
        
        document.querySelectorAll('#iconOptions .opt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#iconOptions .opt-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                previewIcon.innerHTML = icons[btn.dataset.icon];
            });
        });

        document.querySelectorAll('#colorOptions .opt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#colorOptions .opt-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const color = btn.dataset.color;
                if(color === 'holo') {
                    previewText.style.background = 'linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc)';
                    previewText.style.webkitBackgroundClip = 'text';
                    previewText.style.color = 'transparent';
                } else {
                    previewText.style.background = 'none';
                    previewText.style.color = color;
                    previewIcon.style.fill = color;
                }
            });
        });

        document.getElementById('addToCartBtn').addEventListener('click', () => {
            const text = `Siema! Chcę zamówić naklejkę z tekstem: ${handleText.value}`;
            window.open(`https://ig.me/m/${INSTAGRAM_USERNAME}?text=${encodeURIComponent(text)}`, '_blank');
        });

        // KATALOG
        const grid = document.getElementById('stickerGrid');
        function renderGrid() {
            grid.innerHTML = stickers.map(s => `
                <article class="card" data-id="${s.id}">
                    <div class="card-img">
                        <button class="like-btn ${wishlist.includes(s.id) ? 'is-liked' : ''}" data-like="${s.id}"></button>
                        <img src="${s.images[0]}">
                    </div>
                    <div class="card-info"><div class="card-title">${s.title}</div><div class="card-tag">${s.category}</div></div>
                </article>
            `).join('');
            grid.querySelectorAll('.like-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation();
                const id = Number(btn.dataset.like);
                const idx = wishlist.indexOf(id);
                if(idx >= 0) wishlist.splice(idx, 1); else wishlist.push(id);
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                renderGrid();
            }));
        }

        renderGrid();
    </script>
</body>
</html>
